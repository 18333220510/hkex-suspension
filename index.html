<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="港交所新增停牌与长期停牌公司进展公告查询，数据来自披露易。">
<title>港交所停牌公告查询</title>
<style>
  :root {
    --primary: #17324D;
    --bg: #f5f6f8;
    --card: #fff;
    --text: #1f2329;
    --muted: #737b87;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header { background: var(--primary); color: #fff; padding: 18px 16px; }
  header .inner, main, footer { max-width: 760px; margin: 0 auto; }
  header .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 20px; font-weight: 650; }
  header .sub { font-size: 12px; opacity: .88; margin-top: 4px; }
  main { padding: 14px 12px 28px; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .note { color: var(--muted); font-size: 10px; margin-top: 1px; }
  .stat .number { color: var(--primary); font-size: 25px; font-weight: 650; line-height: 1.3; }
  .filters {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .search-row { display: flex; gap: 8px; }
  input[type="search"], input[type="date"] {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 10px; font-size: 14px; background: #fff; color: var(--text);
  }
  input[type="search"] { flex: 1; min-width: 0; width: 100%; }
  .date-row { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .date-row input { flex: 1; min-width: 0; width: 100%; }
  .chip-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .chip, .export-btn {
    font-size: 13px; padding: 6px 13px; border-radius: 16px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .export-btn { flex-shrink: 0; border-color: var(--primary); color: var(--primary); }
  .export-btn:active { background: #e9eff5; }
  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .count { font-size: 12px; color: var(--muted); padding: 12px 2px 6px; }
  ul.list { list-style: none; padding-top: 2px; }
  li.item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 13px; margin-bottom: 10px; }
  li.item.hot { border-color: #f0a8ac; background: #fffafa; }
  li.item .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; background: #e9eff5; color: var(--primary); }
  .badge.progress { background: #fff4e5; color: #a75108; }
  .badge.hot { background: #fff4e5; color: #a75108; white-space: normal; }
  .name { font-size: 15px; font-weight: 600; }
  .code { font-size: 13px; color: var(--muted); font-family: ui-monospace, monospace; }
  .related { margin-top: 8px; font-size: 12px; }
  .related summary { display: inline-flex; align-items: center; cursor: pointer; color: var(--primary); padding: 3px 0; }
  .related ul { list-style: none; margin-top: 5px; padding: 6px 10px; background: #f8f9fb; border-radius: 7px; }
  .related li { padding: 3px 0; overflow-wrap: anywhere; }
  .related .related-name { color: #4b5563; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 7px; display: flex; gap: 12px; flex-wrap: wrap; }
  .title-line { font-size: 13px; margin-top: 7px; color: #4b5563; overflow-wrap: anywhere; white-space: pre-line; }
  a.link { font-size: 13px; color: var(--primary); text-decoration: none; margin-top: 7px; display: inline-block; }
  a.link:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 20px; }
  @media (max-width: 430px) {
    header { padding: 15px 12px; }
    header h1 { font-size: 17px; }
    header .sub { max-width: 270px; }
    main { padding: 10px 10px 24px; }
    .stat { padding: 10px; }
    .stat .number { font-size: 22px; }
    .chip { padding: 6px 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="top">
      <h1>港交所停牌公告查询</h1>
    </div>
    <div class="sub">新增停牌与长期停牌公司进展 · 依据披露易每小时自动更新</div>
  </div>
</header>

<main>
  <section class="summary" aria-label="公告统计">
    <div class="stat"><div class="label">今日新增停牌</div><div class="note">按香港公告日期统计</div><div class="number" id="newTotal">–</div></div>
    <div class="stat"><div class="label">长期停牌公司进展的公告</div><div class="number" id="progressTotal">–</div></div>
  </section>

  <section class="filters" aria-label="筛选公告">
    <div class="search-row">
      <input type="search" id="q" placeholder="搜索公司、股票代码或公告标题…" autocomplete="off" aria-label="搜索公告">
      <button class="export-btn" id="export" type="button">导出 CSV</button>
    </div>
    <div class="date-row">
      <input type="date" id="from" aria-label="开始日期">
      <span>至</span>
      <input type="date" id="to" aria-label="结束日期">
    </div>
    <div class="chip-row" id="groupChips">
      <button class="chip on" data-group="all" type="button">全部</button>
      <button class="chip" data-group="新增停牌" type="button">新增停牌</button>
      <button class="chip" data-group="长期停牌公司进展" type="button">长期停牌公司进展</button>
    </div>
  </section>

  <div class="count" id="count" aria-live="polite"></div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" style="display:none">没有符合条件的公告</div>
</main>

<footer>仅收录股票停牌相关公告，不展示实际复牌记录。原文以披露易为准。<div id="latest"></div></footer>

<script src="scripts/securities.js"></script>
<script src="scripts/stats.js"></script>
<script>
(async function () {
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');
  const qEl = document.getElementById('q');
  const fromEl = document.getElementById('from');
  const toEl = document.getElementById('to');
  const exportEl = document.getElementById('export');
  const chipsEl = document.getElementById('groupChips');

  let data = [];
  try {
    const resp = await fetch('data/announcements.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    data = await resp.json();
  } catch (e) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = '数据加载失败，请稍后重试';
    return;
  }
  data = data.filter(d => d.group === '新增停牌' || d.group === '长期停牌公司进展');
  data.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

  function updateSummary() {
    document.getElementById('newTotal').textContent = SuspensionStats.countTodayNew(data, new Date());
    document.getElementById('progressTotal').textContent = data.filter(d => d.group === '长期停牌公司进展').length;
  }
  updateSummary();
  // 页面保持打开时也会在香港午夜后重算；回到前台时立即刷新。
  setInterval(updateSummary, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateSummary(); });
  if (data.length) document.getElementById('latest').textContent = '最新公告：' + data[0].date + ' ' + data[0].time;

  let curGroup = 'all';

  function filtered() {
    const q = qEl.value.trim().toLowerCase();
    const from = fromEl.value, to = toEl.value;
    return data.filter(d => {
      if (curGroup !== 'all' && d.group !== curGroup) return false;
      if (from && d.date < from) return false;
      if (to && d.date > to) return false;
      if (q) {
        const hay = (d.stockName + ' ' + d.stockCode + ' ' + d.title).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function render() {
    const items = filtered();
    const fresh = items.filter(d => d.group === '新增停牌').length;
    countEl.textContent = '当前 ' + items.length + ' 条（新增停牌 ' + fresh + ' / 长期停牌公司进展 ' + (items.length - fresh) + '）';
    emptyEl.style.display = items.length ? 'none' : 'block';
    listEl.innerHTML = items.map(d => {
      const hot = (d.attention || []).length > 0;
      const progress = d.group === '长期停牌公司进展';
      const securities = SecurityDisplay.entities(d);
      const primary = securities[0] || { name: '', code: '' };
      const related = securities.slice(1);
      return '<li class="item' + (hot ? ' hot' : '') + '">' +
        '<div class="top">' +
          '<span class="name">' + esc(primary.name) + '</span>' +
          (primary.code ? '<span class="code">（' + esc(primary.code) + '）</span>' : '') +
          '<span class="badge' + (progress ? ' progress' : '') + '">' + esc(d.group) + '</span>' +
          '<span class="badge">' + esc(d.nature) + '</span>' +
          (hot ? '<span class="badge hot">⚠ 重点关注 · ' + esc((d.attention || []).join(' / ')) + '</span>' : '') +
        '</div>' +
        '<div class="meta"><span>' + esc(d.date) + ' ' + esc(d.time) + '</span></div>' +
        (related.length ? '<details class="related"><summary>另涉及 ' + related.length + ' 个相关证券</summary><ul>' +
          related.map(s => '<li><span class="related-name">' + esc(s.name) + '</span>' + (s.code ? ' <span class="code">（' + esc(s.code) + '）</span>' : '') + '</li>').join('') +
          '</ul></details>' : '') +
        (d.title ? '<div class="title-line">' + esc(d.title) + '</div>' : '') +
        '<a class="link" href="' + esc(d.url) + '" target="_blank" rel="noopener">查看公告原文（披露易）↗</a>' +
      '</li>';
    }).join('');
  }

  function exportCsv() {
    const items = filtered();
    const head = ['公告分组', '性质', '日期', '时间', '公司名称', '股票代码', '公告标题', '重点关注', '栏目分类', '原文链接'];
    const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(cell).join(',')].concat(items.map(d =>
      [d.group, d.nature, d.date, d.time, d.stockName, d.stockCode, d.title, (d.attention || []).join(' / '), d.category, d.url].map(cell).join(',')
    ));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hkex_停牌公告_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  chipsEl.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    curGroup = btn.dataset.group;
    chipsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === btn));
    render();
  });
  exportEl.addEventListener('click', exportCsv);
  [qEl, fromEl, toEl].forEach(el => el.addEventListener('input', render));
  render();
})();
</script>
</body>
</html>
