name: 自动更新停牌公告

on:
  schedule:
    # 每小时第 17 分钟（UTC），仅抓香港最近 1 天。
    - cron: "17 * * * *"
    # 每天 16:10 UTC，即香港时间次日 00:10，回补最近 5 天；香港无夏令时。
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: 回补最近几天（含香港今天；1=增量，5=每日回补，也可填更大范围）
        required: true
        default: "1"
        type: string

permissions:
  contents: write

# 每小时和每日任务共用同一队列；即使调度延迟也不会同时写入 main。
concurrency:
  group: update-hkex-suspensions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出 main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 运行分类测试
        run: python3 -m unittest discover -s tests -v

      - name: 运行证券显示测试
        run: node --test tests/test_securities.js

      - name: 按调度模式抓取公告
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_DAYS: ${{ inputs.days }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            days="$MANUAL_DAYS"
            mode="手动回补"
          elif [ "$SCHEDULE" = "10 16 * * *" ]; then
            days="5"
            mode="每日 5 天回补"
          else
            days="1"
            mode="每小时 1 天增量"
          fi
          echo "运行模式：$mode（最近 $days 天）"
          python3 scripts/fetch.py --days "$days"

      - name: 有数据变化才提交并推送
        run: |
          if git diff --quiet -- data/announcements.json; then
            echo "公告数据无变化，不提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/announcements.json
          git commit -m "停牌公告自动更新：$(TZ=Asia/Hong_Kong date +%F)"
          git push origin main
